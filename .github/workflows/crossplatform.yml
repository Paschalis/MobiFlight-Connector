name: Cross Platform Build

# Builds the portable MobiFlight tools for macOS and Linux.
#
# The Connector itself is a WinForms application and stays Windows only; this workflow covers
# everything under src/crossplatform, which is deliberately free of Windows dependencies.

on:
  workflow_dispatch:
  pull_request:
    branches: [main, hotfix/*]
    paths:
      - "src/crossplatform/**"
      - ".github/workflows/crossplatform.yml"
  push:
    branches: [main]
    paths:
      - "src/crossplatform/**"
      - ".github/workflows/crossplatform.yml"
  release:
    types: [published]

env:
  SOLUTION: src/crossplatform/MobiFlightCrossPlatform.slnx
  CLI_PROJECT: src/crossplatform/MobiFlight.Cli/MobiFlight.Cli.csproj
  VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || format('0.0.{0}.{1}', github.event.number, github.run_number) }}

jobs:
  # Runs the test suite on all three operating systems. This is what proves the code is
  # actually portable rather than merely compiling for a portable target.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.SOLUTION }} --configuration Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  publish:
    needs: test

    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon Macs, which is what X-Plane 12 runs on natively today.
          - rid: osx-arm64
            os: macos-latest
            archive: tar.gz
          - rid: osx-x64
            os: macos-latest
            archive: tar.gz
          - rid: linux-x64
            os: ubuntu-latest
            archive: tar.gz
          # Covers Raspberry Pi 4/5 class hardware used for cockpit backends.
          - rid: linux-arm64
            os: ubuntu-latest
            archive: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Publish self contained binary
        run: >
          dotnet publish ${{ env.CLI_PROJECT }}
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:Version=${{ env.VERSION }}
          --output dist/${{ matrix.rid }}

      # A self contained build carries its own runtime, so the user does not need
      # the .NET SDK or runtime installed.
      - name: Stage release files
        run: |
          cp README.md dist/${{ matrix.rid }}/ 2>/dev/null || true
          cp docs/CROSS_PLATFORM.md dist/${{ matrix.rid }}/ 2>/dev/null || true
          rm -f dist/${{ matrix.rid }}/*.pdb

      - name: Create archive
        run: |
          cd dist/${{ matrix.rid }}
          tar -czf ../../mobiflight-${{ env.VERSION }}-${{ matrix.rid }}.tar.gz *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobiflight-${{ matrix.rid }}
          path: mobiflight-${{ env.VERSION }}-${{ matrix.rid }}.tar.gz
          if-no-files-found: error

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: mobiflight-${{ env.VERSION }}-${{ matrix.rid }}.tar.gz
